name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or reuse (with or without the v prefix)
        required: false
        type: string
      bump:
        description: Version bump to apply when tag is omitted
        required: false
        default: auto
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  tag:
    name: Create release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    env:
      INPUT_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}
      INPUT_BUMP: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.bump || 'auto' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail

          git fetch --tags --force

          tag="$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)"

          if [ -z "$tag" ] && [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
            if [[ "$tag" != v* ]]; then
              tag="v${tag}"
            fi
          fi

          if [ -z "$tag" ]; then
            latest="$(git tag --list 'v*' --sort=-version:refname | head -n1 || true)"

            if [ -z "$latest" ]; then
              tag="v1.0.0"
            else
              version="${latest#v}"
              IFS='.' read -r major minor patch <<< "$version"
              bump="$INPUT_BUMP"

              if [ "$bump" = "auto" ]; then
                commits="$(git log --format='%s%n%b' "${latest}..HEAD")"

                if printf '%s\n' "$commits" | grep -Eq 'BREAKING CHANGE|^[^[:space:]]+(\([^)]+\))?!:'; then
                  bump="major"
                elif printf '%s\n' "$commits" | grep -Eq '^feat(\([^)]+\))?:'; then
                  bump="minor"
                else
                  bump="patch"
                fi
              fi

              case "$bump" in
                major)
                  major=$((major + 1))
                  minor=0
                  patch=0
                  ;;
                minor)
                  minor=$((minor + 1))
                  patch=0
                  ;;
                patch|auto)
                  patch=$((patch + 1))
                  ;;
                *)
                  echo "Unsupported bump: $bump" >&2
                  exit 1
                  ;;
              esac

              tag="v${major}.${minor}.${patch}"
            fi
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must match vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi

          if git rev-parse --verify -q "refs/tags/$tag" >/dev/null; then
            target_commit="$(git rev-list -n 1 "refs/tags/$tag")"
            head_commit="$(git rev-parse HEAD)"

            if [ "$target_commit" != "$head_commit" ]; then
              echo "Tag $tag already exists on a different commit" >&2
              exit 1
            fi

            echo "Tag $tag already points at HEAD"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "Release $tag"
            git push origin "$tag"
            echo "Created and pushed $tag"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Show release tag
        run: echo "Releasing ${{ steps.version.outputs.tag }}"

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: tag

    steps:
      - name: Checkout tagged ref
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: refs/tags/${{ needs.tag.outputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'

      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release-artifacts-${{ needs.tag.outputs.tag }}
          path: dist/*
