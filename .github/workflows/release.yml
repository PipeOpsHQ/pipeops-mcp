name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.3'

      - name: Run tests
        run: go test -v ./...

      - name: Build for multiple platforms
        run: |
          mkdir -p dist
          
          # Linux AMD64
          GOOS=linux GOARCH=amd64 go build -o dist/pipeops-mcp-server-linux-amd64 ./cmd/pipeops-mcp-server
          
          # Linux ARM64
          GOOS=linux GOARCH=arm64 go build -o dist/pipeops-mcp-server-linux-arm64 ./cmd/pipeops-mcp-server
          
          # macOS AMD64
          GOOS=darwin GOARCH=amd64 go build -o dist/pipeops-mcp-server-darwin-amd64 ./cmd/pipeops-mcp-server
          
          # macOS ARM64
          GOOS=darwin GOARCH=arm64 go build -o dist/pipeops-mcp-server-darwin-arm64 ./cmd/pipeops-mcp-server
          
          # Windows AMD64
          GOOS=windows GOARCH=amd64 go build -o dist/pipeops-mcp-server-windows-amd64.exe ./cmd/pipeops-mcp-server

      - name: Create checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/pipeops-mcp-server-*
            dist/checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Submit to MCP Registry
        run: |
          echo "To publish to MCP registry, create a PR at:"
          echo "https://github.com/modelcontextprotocol/registry"
          echo "Add reference to: https://github.com/PipeOpsHQ/pipeops-mcp"
